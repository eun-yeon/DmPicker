[package]
name = "dmpicker-app"
edition.workspace = true
version.workspace = true

[[bin]]
name = "DmPicker"
path = "src/main.rs"

[dependencies]
dmpicker-search = { path = "../dmpicker-search" }
dmpicker-engine = { path = "../dmpicker-engine" }
dmpicker-nav = { path = "../dmpicker-nav" }
dmpicker-update = { path = "../dmpicker-update" }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["webp", "png"] }
windows-numerics = "0.3"
windows-core = "0.62"
windows-collections = "0.3"
unicode-segmentation = "1"

[dependencies.windows]
version = "0.62"
features = [
    "Foundation",
    "Graphics_DirectX",
    "Graphics_Effects",
    "System",
    "UI",
    "UI_Composition",
    "UI_Composition_Desktop",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Composition",
    "Win32_System_WinRT_Graphics_Direct2D",
    "Win32_System_Time",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3"
